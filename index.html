<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1230" />
    <title>Kaizen App</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="styles.css" />
    <script src="db.js"></script>
    <script src="config.js"></script>
    <script src="ui.js"></script>
    <script src="skor.js"></script>
    <script src="sync.js"></script>
    <script src="character.js"></script>
    <script src="achievements.js"></script>
    <script src="journal.js"></script>
    <script src="kaizen.js"></script>
    <script src="recovery.js"></script>
    <script src="dashboard.js"></script>
    <script src="manager.js"></script>
    <script src="quest.js"></script>
    <script src="trackers.js"></script>
    <script src="settings.js"></script>
    <script src="navigasi.js"></script>
    <script src="karakter-ui.js"></script>
    <script src="fx.js"></script>
    <link rel="icon" href="kaizen-logo-icon-192.png" />
  </head>
  <body>
    <aside class="sidebar" aria-label="Navigasi">
      <div class="sidebar-merek">
        <span class="merek-kanji">改善</span>
        <span class="merek-nama">Kaizen</span>
      </div>

      <div id="sidebar-karakter" class="side-kar"></div>

      <nav class="sidebar-nav">
        <span class="nav-sorot" aria-hidden="true"></span>
        <button class="nav-item" data-target="beranda"><span class="nav-ikon">🏯</span><span class="nav-teks">Beranda</span></button>
        <button class="nav-item" data-target="hari-ini"><span class="nav-ikon">🌅</span><span class="nav-teks">Hari Ini</span></button>
        <button class="nav-item" data-target="habit"><span class="nav-ikon">⚔️</span><span class="nav-teks">Habit</span></button>
        <button class="nav-item" data-target="quest"><span class="nav-ikon">🗺️</span><span class="nav-teks">Quest</span></button>
      </nav>

      <div class="sidebar-kaki">
        <button class="kaki-item" id="nav-ekspor">⬇ Ekspor data</button>
        <button class="kaki-item" id="nav-impor">⬆ Impor data</button>
        <button class="kaki-item" id="nav-setelan">⚙ Setelan</button>
      </div>
    </aside>
    <main class="app">
      <header class="app-header">
        <h1>Kaizen</h1>
        <p id="tanggal-hari-ini" class="tanggal"></p>
      </header>
      <ul id="daftar-habit" class="daftar"></ul>
      <p id="ringkasan" class="ringkasan"></p>
      <section id="quest-mobile" class="quest-mobile"></section>

      <div class="jurnal-aksi">
        <button id="btn-relapse" class="tombol">⚠ Catat relapse</button>
        <button id="btn-pemicu" class="tombol">📝 Catat pemicu</button>
        <button id="btn-surat" class="tombol">✉ Surat masa depan</button>
      </div>

      <footer class="app-footer">
        <button id="btn-ekspor" class="tombol">⬇ Ekspor data</button>
        <button id="btn-impor" class="tombol">⬆ Impor data</button>
        <button id="btn-setelan" class="tombol">⚙ Setelan</button>
        <input id="file-impor" type="file" accept="application/json" hidden />
      </footer>
    </main>

    <section id="dashboard" class="dashboard"></section>
    <section id="manajer" class="manajer"></section>
    <section id="manajer-quest" class="manajer"></section>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js")
            .then((reg) => console.log("SW terdaftar", reg.scope))
            .catch((err) => console.log(err));
        });
      }
      muatTema();
      // Seed dulu (kalau perlu), baru gambar checklist.
      seedJikaKosong()
        .then(() => migrasiHabits())
        .then(() => seedQuestsJikaKosong())
        .then(() => ambilKarakter())
        .then(() => cekRecovery())
        .then(() => cekDelevel())
        .then(() => tampilkanChecklist())
        .then(() => cekAchievements())
        .then(() => cekNaikLevel())
        .then(() => cekSuratMasaDepan())
        .then(() => tawarkanKaizen())
        .then(() => renderDashboard())
        .then(() => renderManajer())
        .then(() => renderQuestMobile())
        .then(() => renderManajerQuest())
        .then(() => renderSidebarKarakter());
      pasangTombolSync();
      pasangTombolJurnal();
      pasangTombolSetelan();
      pasangNavigasi();
    </script>
  </body>
</html>
