<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1230" />
    <title>Kaizen App</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/db.js"></script>
    <script src="js/config.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/skor.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/character.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/manager.js"></script>
    <script src="js/quest.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/navigasi.js"></script>
    <script src="js/karakter-ui.js"></script>
    <script src="js/fx.js"></script>
    <script src="js/cover.js"></script>
    <script src="js/jadwal.js"></script>
    <link rel="icon" href="img/kaizen-logo-icon-192.png" />
  </head>
  <body>
    <aside class="sidebar" aria-label="Navigasi">
      <div class="sidebar-merek">
        <span class="merek-kanji">改善</span>
        <span class="merek-nama">Kaizen</span>
      </div>

      <div id="sidebar-karakter" class="side-kar"></div>

      <nav class="sidebar-nav">
        <span class="nav-sorot" aria-hidden="true"></span>
        <button class="nav-item" data-target="beranda">
          <span class="nav-ikon">🏯</span><span class="nav-teks">Beranda</span>
        </button>
        <button class="nav-item" data-target="hari-ini">
          <span class="nav-ikon">🌅</span><span class="nav-teks">Hari Ini</span>
        </button>
        <button class="nav-item" data-target="habit">
          <span class="nav-ikon">⚔️</span><span class="nav-teks">Habit</span>
        </button>
        <button class="nav-item" data-target="quest">
          <span class="nav-ikon">🗺️</span><span class="nav-teks">Quest</span>
        </button>
        <button class="nav-item" data-target="jadwal">
          <span class="nav-ikon">🕛</span><span class="nav-teks">Jadwal</span>
        </button>
      </nav>

      <div class="sidebar-kaki">
        <button class="kaki-item" id="nav-ekspor">⬇ Ekspor data</button>
        <button class="kaki-item" id="nav-impor">⬆ Impor data</button>
        <button class="kaki-item" id="nav-setelan">⚙ Setelan</button>
      </div>
    </aside>
    <main class="app">
      <header class="app-header">
        <h1>Kaizen</h1>
        <p id="tanggal-hari-ini" class="tanggal"></p>
      </header>
      <ul id="daftar-habit" class="daftar"></ul>
      <p id="ringkasan" class="ringkasan"></p>
      <section id="quest-mobile-list" class="quest-m"></section>
      <section id="jadwal-mobile" class="jadwal-mobile"></section>

      <footer class="app-footer">
        <button id="btn-ekspor" class="tombol">⬇ Ekspor data</button>
        <button id="btn-impor" class="tombol">⬆ Impor data</button>
        <button id="btn-setelan" class="tombol">⚙ Setelan</button>
        <input id="file-impor" type="file" accept="application/json" hidden />
      </footer>
    </main>

    <section id="dashboard" class="dashboard"></section>
    <section id="manajer" class="manajer"></section>
    <section id="manajer-quest" class="manajer"></section>
    <section id="jadwal" class="jadwal"></section>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js")
            .then((reg) => console.log("SW terdaftar", reg.scope))
            .catch((err) => console.log(err));
        });
      }
      muatTema();
      ambilKarakter()
        .then(() => tampilkanChecklist())
        .then(() => renderDashboard())
        .then(() => renderManajer())
        .then(() => renderQuest())
        .then(() => renderSidebarKarakter())
        .then(() => renderJadwal())
        .then(() => renderJadwalMobile())
        .then(() => renderQuestMobile());
      pasangTombolSync();
      pasangTombolSetelan();
      pasangNavigasi();
    </script>
  </body>
</html>
